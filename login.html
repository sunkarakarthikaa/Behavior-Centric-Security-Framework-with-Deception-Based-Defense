<!DOCTYPE html>
<html>
<head>
    <title>Secure Login</title>

    <!-- Luxury Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f5f2, #efe7dd);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 20px;
            color: #2c2c2c;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px auto;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            display: block;
        }

        button {
            width: 85%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #c9a96e; /* gold tone */
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: block;
             margin: 10px auto;
        }

        button:hover {
            background: #b8955c;
        }

        .subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Secure Access</h1>
    <div class="subtitle">Neuro-Behavioral Authentication</div>

    <form onsubmit="return false;">

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button type="button" onclick="login()">Login</button>

</form>
</div>

<script>
let wrongAttempts = 0;

function login(){

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;

    // ✅ CORRECT CREDENTIALS
    if(username === "admin" &&
       password === "Karthika$890"){
        fetch(`http://localhost:8080/baseline/${username}`)
.then(res => res.json())
.then(baseline => {

    sessionStorage.setItem(
        "medsecure_baseline",
        JSON.stringify(baseline)
    );

    console.log("Baseline loaded:", baseline);

        // LOW RISK
        if(wrongAttempts === 0){

            sessionStorage.setItem("loggedIn", "true");

            window.location.href = "dashboard.html";
        }

        // MEDIUM RISK
        else if(wrongAttempts <= 2){

            let challenge =
                generateAIChallenge(password);

            let ans =
                prompt(challenge.question);

            if(ans === challenge.answer){

                sessionStorage.setItem("loggedIn", "true");

                window.location.href = "dashboard.html";
            }
            else{

                window.location.href = "fake.html";
            }
        }

        // HIGH RISK
        else{

            window.location.href = "fake.html";
        }
 });
}
    // ❌ WRONG CREDENTIALS
    else{

        wrongAttempts++;

        alert("Invalid credentials ❌");
    }
}

function generateAIChallenge(password){

    // remove symbols/numbers
    let letters =
        password.replace(/[^a-zA-Z]/g, "");

    // random position
    let index =
        Math.floor(Math.random() * letters.length);

    let ch =
        letters[index].toLowerCase();

    // alphabet position
    let answer =
        ch.charCodeAt(0) - 96;

    return {

        question:
`AI Verification:
What is the alphabetical position of character ${index + 1} in your password?`,

        answer: answer.toString()
    };
}
</script>
<script src="behavior.js"></script>
</body>
</html>
