<!DOCTYPE html>
<html>
<head>
<title>MedSecure Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body {
    margin:0;
    font-family: Inter;
    background:#f6f3ef;
}

/* HEADER */
.header {
    height:60px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;

}

.logo {
    font-family: Playfair Display;
    font-size:20px;
}

.header-left {
    display:flex;
    align-items:center;
    gap:15px;
}

.header-right {
    display:flex;
    align-items:center;
    gap:20px;
}

.risk-low { color: green; }
.risk-medium { color: orange; }
.risk-high { color: red; }

.logout {
    cursor:pointer;
}

/* LAYOUT */
.layout { display:flex; }

/* SIDEBAR */
.sidebar {
    width:220px;
    background:white;
    min-height: 100vh;   
    padding:20px;
}

.menu-item {
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
}

.menu-item:hover {
    background:#f1ebe4;
}

/* CONTENT */
.content {
    flex:1;
    padding:20px;
}

/* CARDS */
.cards {
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card {
    background:white;
    padding:20px;
    border-radius:15px;
    width:200px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.card h3 {
    margin:0;
    font-size:14px;
    color:#888;
}

.card p {
    font-size:22px;
    margin-top:10px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="logo">MedSecure</div>

    <div style="display:flex; align-items:center; gap:20px;">
        <div><i class="fa-solid fa-user"></i> Admin</div>

        <div id="risk" class="risk-low">
            <i class="fa-solid fa-shield-halved"></i> LOW
        </div>

        <div onclick="logout()" style="cursor:pointer;">
            Logout <i class="fa-solid fa-right-from-bracket"></i>
        </div>
    

    </div>

</div>
<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">
    <div style="margin-bottom:15px;margin-left: 11px; margin-bottom: 20px; color:#605c5c;">
    <i class="fa-solid fa-compass"></i> Navigation
</div>
<div class="menu-item" onclick="go('dashboard.html')">Dashboard</div>
<div class="menu-item" onclick="go('patients.html')">Patients</div>
<div class="menu-item" onclick="go('appointments.html')">Appointments</div>
<div class="menu-item" onclick="go('doctors.html')">Doctors</div>
<div style="position:absolute; bottom:20px; width:180px;">
</div>
</div>
<!-- CONTENT -->
<div class="content">

<!-- Set Baseline -->
<button onclick="startBaseline()" 
style="
padding:10px 16px;
border:none;
border-radius:10px;
background:#c9a96e;
color:white;
cursor:pointer;
margin-bottom:20px;
">
Set Baseline
</button>

<!-- Save Baseline -->
<button onclick="stopBaseline()" 
style="
padding:10px 16px;
border:none;
border-radius:10px;
background:#8b5e3c;
color:white;
cursor:pointer;
margin-left:10px;
margin-bottom:20px;
">
Save Baseline
</button>
    <br>
<h3 style="margin-bottom:35px;margin-left: 20px;">
    <i class="fa-solid fa-hospital"></i> Overview
</h3>
    <div class="cards">
        <div class="card"><h3>Total Patients</h3><p id="totalPatients" >0</p></div>
        <div class="card"><h3>ICU Beds</h3><p>20</p></div>
        <div class="card"><h3>Occupied</h3><p>12</p></div>
        <div class="card"><h3>Available</h3><p>8</p></div>
        <div class="card" style="width:100%; max-width:600px;">
    <h3 style="margin-bottom: 15px; margin-left: 5px;">Clinical Notes</h3>

    <textarea id="notesBox"
        placeholder="Write patient observations, diagnosis, or notes..."
        style="
            width:100%;
            height:200px;
            padding:10px;
            border-radius:10px;
            border:1px solid #ddd;
            resize:none;
            font-family:Inter;
            box-sizing:border-box;
        ">
    </textarea>

    <button onclick="saveNotes()" style="margin-top: 12px;">
        Save Notes
    </button>
</div>
    </div>

</div>

</div>

<script>
    let savedBaseline = JSON.parse(sessionStorage.getItem("baseline"));
let baselineMode = false;
let baselineData = [];

function stopBaseline(){
    console.log("STOP BASELINE CALLED");
    baselineMode = false;

    if(baselineData.length === 0){
        alert("No data captured! Please type during baseline.");
        return;
    }

    let avg = calculateAverage(baselineData);
    baselineMode = false;

    savedBaseline = avg;

sessionStorage.setItem(
    "baseline",
    JSON.stringify(savedBaseline)
);

alert("Baseline saved ✔");

keyTimes = [];
mouseMoves = [];
clicks = [];
totalKeysPressed = 0;

document.getElementById("risk").innerHTML =
    '<i class="fa-solid fa-shield-halved"></i> LOW';
}

function calculateAverage(arr){

    let sum = {
    typingSpeed:0,
    keyDelay:0,
    keyHoldTime:0,
    mouseSpeed:0,
    clickInterval:0,
    typingConsistency:0
};
    

    arr.forEach(d=>{
    sum.typingSpeed += d.typingSpeed;
    sum.keyDelay += d.keyDelay;
    sum.keyHoldTime += d.keyHoldTime;
    sum.mouseSpeed += d.mouseSpeed;
    sum.clickInterval += d.clickInterval;
    sum.typingConsistency += d.typingConsistency;
});
   

    let n = arr.length;

    return {
    typingSpeed: sum.typingSpeed/n,
    keyDelay: sum.keyDelay/n,
    keyHoldTime: sum.keyHoldTime/n,
    mouseSpeed: sum.mouseSpeed/n,
    clickInterval: sum.clickInterval/n,
    typingConsistency: sum.typingConsistency/n
};
}

function startBaseline(){

    alert("Baseline recording started (60 seconds)");

    document.getElementById("risk").innerHTML =
        '<i class="fa-solid fa-shield-halved"></i> Recording...';

    baselineMode = true;

    baselineData = [];


    setTimeout(stopBaseline, 60000);
}
// -------- TRACKING --------
let keyTimes = [];
let keyDownTime = {};
let mouseMoves = [];
let clicks = [];
let totalKeysPressed = 0;

document.addEventListener("keydown", (e) => {

    keyDownTime[e.key] = Date.now();

    totalKeysPressed++;

});

document.addEventListener("keyup", (e) => {
    let now = Date.now();
    if (keyDownTime[e.key]) {
        keyTimes.push(now - keyDownTime[e.key]);
    }
});

document.addEventListener("mousemove", () => {
    mouseMoves.push(Date.now());
});

document.addEventListener("click", () => {
    clicks.push(Date.now());
});

// -------- HELPERS --------
function average(arr){
    if(arr.length <= 2){
        return arr.reduce((a,b)=>a+b,0)/arr.length || 0;
    }

    arr.sort((a,b)=>a-b);
    let trimmed = arr.slice(1, arr.length-1);

    return trimmed.reduce((a,b)=>a+b,0) / trimmed.length;
}


// -------- SEND DATA --------
function sendBehavior(){

    if(keyTimes.length < 5){
        console.log("Collecting more data...");
        return;
    }

    let data = {
        typingConsistency: totalKeysPressed,
        typingSpeed: keyTimes.length,
        keyDelay: keyTimes.length > 1
            ? (keyTimes[keyTimes.length-1] - keyTimes[0]) / keyTimes.length
            : 0,
        keyHoldTime: average(keyTimes),
        mouseSpeed: mouseMoves.length,
        clickInterval: clicks.length > 1
            ? (clicks[clicks.length-1] - clicks[0]) / clicks.length
            : 0
    };

    if(baselineMode){

    baselineData.push(data);

    

    return;
}

    console.log("REAL DATA:", data); 
    let payload = {
    current: data,
    baseline: savedBaseline
};
    fetch("http://localhost:8080/behavior/analyze", {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    })
    .then(res=>res.text())
    .then(res=>handleRisk(res));

    keyTimes = [];
    mouseMoves = [];
    clicks = [];
    totalKeysPressed = 0;
}

function loadPatientCount(){
    fetch("http://localhost:8080/patients")
    .then(res=>res.json())
    .then(data=>{
        document.getElementById("totalPatients").innerText = data.length;
    });
}

// call once + refresh
loadPatientCount();
setInterval(loadPatientCount, 5000);
// -------- HANDLE RISK --------
function handleRisk(res){

    let el = document.getElementById("risk");

    if(!savedBaseline){
    el.innerHTML = "No Baseline ⚠️";
    alert("Please set baseline first");
    return;
}

    let level = "LOW";

    if(res.includes("HIGH")) level = "HIGH";
    else if(res.includes("MEDIUM")) level = "MEDIUM";

    if(level === "HIGH"){
        el.className = "risk-high";
        el.innerHTML = "HIGH";
        window.location.href = "fake.html";
    }
    else if(level === "MEDIUM"){
        el.className = "risk-medium";
        el.innerHTML = "MEDIUM";
        showChallenge();
    }
    else{
        el.className = "risk-low";
        el.innerHTML = "LOW";
    }
}

// -------- CHALLENGE --------
function showChallenge(){
    let ans = prompt("Security Check: Enter keyword");

    if(ans !== "secure123"){
        alert("Verification failed!");
        window.location.href = "login.html";
    }
}

// -------- LOOP --------
setInterval(sendBehavior, 10000);
function saveNotes(){

    let note = document.getElementById("notesBox").value;

    localStorage.setItem("clinicalNote", note);

    alert("Saved locally ✔");
}

</script>

<script>
    
    // 🔒 PROTECT PAGE
if(sessionStorage.getItem("loggedIn") !== "true"){
    window.location.replace("login.html");
}

function go(page){
    window.location.href = page;
}
function logout(){
    sessionStorage.removeItem("loggedIn");

    // replace prevents going back
    window.location.replace("login.html");
}

function saveClinicalNote(){

    let note = document.getElementById("clinicalNote").value;

    localStorage.setItem("clinicalNote", note);

    alert("Saved locally ✔");
}
window.onload = function(){

    let note = localStorage.getItem("clinicalNote");

    if(note){
        document.getElementById("notesBox").value = note;
    }

    loadPatientCount();

    document.getElementById("risk").innerHTML =
    '<i class="fa-solid fa-shield-halved"></i> LOW';
}

</script>

</body>
</html>
