<!DOCTYPE html>
<html>
<head>
<title>MedSecure Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body {
    margin:0;
    font-family: Inter;
    background:#f6f3ef;
}

/* HEADER */
.header {
    height:60px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;

}

.logo {
    font-family: Playfair Display;
    font-size:20px;
}

.header-left {
    display:flex;
    align-items:center;
    gap:15px;
}

.header-right {
    display:flex;
    align-items:center;
    gap:20px;
}

.risk-low { color: green; }
.risk-medium { color: orange; }
.risk-high { color: red; }

.logout {
    cursor:pointer;
}

/* LAYOUT */
.layout { display:flex; }

/* SIDEBAR */
.sidebar {
    width:220px;
    background:white;
    min-height: 100vh;   
    padding:20px;
}

.menu-item {
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
}

.menu-item:hover {
    background:#f1ebe4;
}

/* CONTENT */
.content {
    flex:1;
    padding:20px;
}

/* CARDS */
.cards {
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card {
    background:white;
    padding:20px;
    border-radius:15px;
    width:200px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.card h3 {
    margin:0;
    font-size:14px;
    color:#888;
}

.card p {
    font-size:22px;
    margin-top:10px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="logo">MedSecure</div>

    <div style="display:flex; align-items:center; gap:20px;">
        <div><i class="fa-solid fa-user"></i> Admin</div>

        <div id="risk" class="risk-low">
            <i class="fa-solid fa-shield-halved"></i> LOW
        </div>

        <div onclick="logout()" style="cursor:pointer;">
            Logout <i class="fa-solid fa-right-from-bracket"></i>
        </div>
    

    </div>

</div>
<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">
    <div style="margin-bottom:15px;margin-left: 11px; margin-bottom: 20px; color:#605c5c;">
    <i class="fa-solid fa-compass"></i> Navigation
</div>
<div class="menu-item" onclick="go('dashboard.html')">Dashboard</div>
<div class="menu-item" onclick="go('patients.html')">Patients</div>
<div class="menu-item" onclick="go('appointments.html')">Appointments</div>
<div class="menu-item" onclick="go('doctors.html')">Doctors</div>
<div style="position:absolute; bottom:20px; width:180px;">
</div>
</div>
<!-- CONTENT -->
<div class="content">

<!-- Set Baseline 
 <br>
<button onclick="startBaseline()">Set Baseline</button><br><br>
<button onclick="stopBaseline()">Save Baseline</button>
    <br>-->
<h3 style="margin-bottom:35px;margin-left: 20px;">
    <i class="fa-solid fa-hospital"></i> Overview
</h3>
    <div class="cards">
        <div class="card"><h3>Total Patients</h3><p id="totalPatients" >0</p></div>
        <div class="card"><h3>ICU Beds</h3><p>20</p></div>
        <div class="card"><h3>Occupied</h3><p>12</p></div>
        <div class="card"><h3>Available</h3><p>8</p></div>
        <div class="card" style="width:100%; max-width:600px;">
    <h3 style="margin-bottom: 15px; margin-left: 5px;">Clinical Notes</h3>

    <textarea id="notesBox"
        placeholder="Write patient observations, diagnosis, or notes..."
        style="
            width:100%;
            height:200px;
            padding:10px;
            border-radius:10px;
            border:1px solid #ddd;
            resize:none;
            font-family:Inter;
            box-sizing:border-box;
        ">
    </textarea>

    <button onclick="saveNotes()" style="margin-top: 12px;">
        Save Notes
    </button>
</div>
    </div>

</div>

</div>

<script src="src/main/resources/static/behavior.js"></script>

<script>
  // Page protection
  if (sessionStorage.getItem("loggedIn") !== "true") {
    window.location.replace("login.html");
  }

  function go(page) {
    window.location.href = page;
  }

  function logout() {
    sessionStorage.removeItem("loggedIn");
    window.location.replace("login.html");
  }

  // Notes
  function saveNotes() {
    localStorage.setItem(
      "clinicalNote",
      document.getElementById("notesBox").value
    );

    alert("Saved locally ✔");
  }

  // Patient count
  function loadPatientCount() {
    fetch("http://localhost:8080/patients")
      .then(function(r){ return r.json(); })
      .then(function(d){
        document.getElementById("totalPatients").innerText = d.length;
      });
  }

  window.onload = function() {

    var note = localStorage.getItem("clinicalNote");

    if (note) {
      document.getElementById("notesBox").value = note;
    }

    loadPatientCount();
  };

  setInterval(loadPatientCount, 5000);
</script>
</body>
</html>
